[project]
name = "llm-engineering-lab"
version = "0.1.0"
description = "用于学习Python以及LLM应用开发的实验室"
readme = "README.md"
authors = [
    { name = "ellis", email = "hongfeisir@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-engineering-lab = "llm_engineering_lab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

